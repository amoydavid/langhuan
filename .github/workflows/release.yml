name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web frontend
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build

      - name: Cross-compile binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -tags web_embed -trimpath -ldflags="-s -w" \
            -o "langhuan-${GOOS}-${GOARCH}${ext}" \
            ./cmd/langhuan

      - name: Compress (unix)
        if: matrix.goos != 'windows'
        run: tar -czf "langhuan-${GOOS}-${GOARCH}.tar.gz" -C . "langhuan-${GOOS}-${GOARCH}"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Compress (windows)
        if: matrix.goos == 'windows'
        run: zip "langhuan-windows-amd64.zip" "langhuan-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            langhuan-*.tar.gz
            langhuan-*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 安装

            下载对应平台的压缩包，解压后直接运行（零配置，无需 Docker/PostgreSQL/Redis）：

            ```bash
            ./langhuan
            ```

            首次运行自动在 `~/.langhuan-data/` 生成 SQLite 数据库与配置。
            打开 http://127.0.0.1:8080 即可使用。

            生产部署（PostgreSQL + Redis）见 [README](https://github.com/amoydavid/langhuan#readme)。
