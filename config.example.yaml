server:
  http_addr: ":8080"
  # 全局服务地址，Web/REST/MCP/邀请链接都从它派生。本地默认 http://127.0.0.1:8080，
  # 生产部署必须使用 HTTPS，例如 https://langhuan.example.com 或带前缀 https://example.com/langhuan。
  base_url: "http://127.0.0.1:8080"
  run_http: true
  run_worker: true

database:
  driver: postgres
  dsn: "postgres://localhost:5432/langhuan?sslmode=disable"
  auto_migrate: true

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

log:
  level: info

storage:
  # 存储后端：local（本地文件系统）或 s3（S3-compatible 对象存储）。
  # local 模式适合单机开发；s3 模式适合生产多副本部署，支持 RustFS/MinIO/阿里云/腾讯云。
  driver: local
  raw_document_dir: "./data/raw-documents"
  s3:
    endpoint: "http://127.0.0.1:19000"
    region: "us-east-1"
    bucket: "langhuan"
    access_key: ""
    secret_key: ""
    force_path_style: true
    public_base_url: ""
  # 解析图片资产的归档限制（PDF 等 ParserU 产出的图片）。
  assets:
    max_count_per_document: 500
    max_image_size_bytes: 10485760
    allowed_mime_types:
      - image/png
      - image/jpeg
      - image/webp
      - image/gif

ingest:
  max_file_size_bytes: 52428800
  allowed_file_types:
    - pdf
    - markdown
    - md
    - txt
    - csv
    - xlsx
    - docx

# MinerU Cloud PDF 解析运行参数。
# MinerU token 属于敏感凭证，不在此配置；启用前先在 model_providers 表
# （Web Console › 模型 › 创建连接 › MinerU Cloud）写入有效 token。
mineru:
  enabled: false
  model_version: "vlm"          # vlm | pipeline
  poll_interval_seconds: 10
  max_poll_attempts: 180
  upload_timeout_seconds: 120
  result_download_timeout_seconds: 120
  max_zip_image_bytes: 20971520 # zip 内单个图片解压大小上限（默认 20MB）

retrieval:
  failed_staging_retention: 24h
  retired_generation_retention: 168h
  cleanup_batch_size: 1000

credentials:
  # 生成命令：openssl rand -base64 32
  # 将输出复制到实际 config.yaml，不要包含行尾换行；不要提交真实值。
  encryption_key: ""

auth:
  session:
    cookie_name: "langhuan_session"
    lifetime_seconds: 604800          # 7 天
    secure_cookie: true               # 生产必须为 true
    domain: ""                        # 可选，留空表示同源
  password:
    enabled: true                     # 运行期 email+password 登录开关；false 时 /auth/login 返回 403。默认 true（向后兼容）
    argon2_memory_kib: 65536          # 64 MiB
    argon2_iterations: 3
    argon2_parallelism: 2
  rate_limit:
    login_max_attempts: 5
    login_window_seconds: 900         # 15 分钟
  invitation:
    lifetime_seconds: 604800          # 7 天
  oidc:
    enabled: false                    # 默认关闭；企业内部部署建议开启并配合 password.enabled=false
    issuer: ""                        # 如 https://sso.example.com/realms/corp
    client_id: ""
    client_secret: ""
    redirect_url: ""                  # 如 https://langhuan.example.com/api/v1/auth/oidc/callback
    require_email_verified: true      # 推荐保持 true；仅受控 IdP 确实不提供该 claim 时显式关闭
    state_ttl_seconds: 300
    http_timeout_seconds: 10
    scopes: []                        # 空则默认 [openid, profile, email]

# Workspace API Key 程序化访问参数
api_key:
  default_lifetime_seconds: 7776000     # 默认 90 天
  max_lifetime_seconds: 31536000        # 最长 365 天
  last_used_touch_interval_seconds: 300 # 最近使用 5 分钟节流
  active_limit: 100                     # 单 Workspace 活跃 key 上限

# MCP transport 参数
mcp:
  inline_ingest_max_file_size_bytes: 8388608 # document_ingest 内联 Base64 上限 8 MiB

# 多知识库检索参数
search:
  multi_knowledge_base_limit: 20 # knowledge_search 最多查询的知识库数
  multi_concurrency: 4           # 多库检索默认并发
  multi_merge_rrf_k: 60          # 跨库 RRF 合并参数

# 飞书知识库同步调度参数。
#
# 背景：飞书同步型知识库的定时同步不是由系统定时器直接触发，而是由一个常驻
# 后台进程（Meta Scheduler）周期性地"扫描 + 入队"完成。它每隔
# scheduler_interval_seconds 醒一次，做三件事：
#   1. 查所有"该同步了"的飞书知识库（到期判定见下）
#   2. 对每个飞书应用（source connection），检查它名下当前有几个同步任务
#      还在跑（pending/running）
#   3. 把"到期且还有空闲额度"的知识库推入异步队列，直到填满
#      max_concurrent_per_connection 或没有更多到期项
#
# 什么是"到期"：每个飞书知识库在 source_config 里记录两个值——
#   - cron：用户设置的同步频率（如 "0 */6 * * *" 表示每 6 小时一次）
#   - next_sync_at：下次应同步的时刻
# 每次某知识库被成功入队后，系统按其 cron 重算 next_sync_at。
# "到期"就是 next_sync_at <= 当前时间。没有配 cron 的知识库不会被定时同步，
# 只能手动触发（创建时或点"手动同步"按钮）。
#
# scheduler_interval_seconds 决定的是这种"检查有没有到期项"的频率，也就是
# 定时同步的最大延迟精度——不是同步频率本身。同步频率由每个知识库的 cron 决定。
# 调小：到期项被更快入队，但每周期多一次 ListDueFeishuKBs 数据库查询。
# 调大：到期项最多多等一个周期才被入队，数据库扫描更省。
source_sync:
  scheduler_interval_seconds: 60   # 调度器扫描周期（秒）：每隔多久检查一次有没有飞书知识库到期该同步
  max_concurrent_per_connection: 2 # 每个飞书应用同时最多跑几个同步任务；超额的到期项排队等下一次扫描或 worker 完成后续跑
